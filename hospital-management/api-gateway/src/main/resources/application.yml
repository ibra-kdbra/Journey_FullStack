server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # Gateway 5.0 moved every property under server.webflux (or server.webmvc).
      # The old spring.cloud.gateway.* keys no longer exist, and nothing binds
      # them — the app would start clean and route nothing.
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: patient-service
              uri: lb://patient-service
              predicates:
                - Path=/api/v1/patients/**

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
