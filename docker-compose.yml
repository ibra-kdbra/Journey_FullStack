version: '3.8'
services:
  appseed-app:
    container_name: appseed_app
    restart: always
    build: .
    env_file:
      - .env # copy .env.sample to .env and set SECRET_KEY
    volumes:
      - app_data:/data # persists the SQLite database (SQLITE_PATH=/data/db.sqlite3)
    networks:
      - db_network
      - web_network
  nginx:
    container_name: nginx
    restart: always
    image: "nginx:latest"
    ports:
      - "5085:5085"
    volumes:
      - ./nginx:/etc/nginx/conf.d
    networks:
      - web_network
    depends_on: 
      - appseed-app
networks:
  db_network:
    driver: bridge
  web_network:
    driver: bridge
 
volumes:
  app_data:
