# Local development only: `SPRING_PROFILES_ACTIVE=dev mvn spring-boot:run`.
# The credentials below are fake, well-known values for a laptop; never use the
# dev profile anywhere reachable from a network.
spring:
  datasource:
    username: ${DB_USER:user}
    password: ${DB_PASSWORD:password}
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

hospital:
  security:
    username: ${HOSPITAL_API_USER:dev}
    password: ${HOSPITAL_API_PASSWORD:dev-password}

eureka:
  client:
    serviceUrl:
      defaultZone: http://${EUREKA_USER:dev}:${EUREKA_PASSWORD:dev-password}@${EUREKA_HOST:localhost}:8761/eureka/
