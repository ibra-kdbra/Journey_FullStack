[tool.ruff]
line-length = 89
indent-width = 4
# Alembic writes these; `flask db migrate` would reintroduce a lint failure
# every time. env.py is hand-maintained and stays linted.
exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    # Pyflakes
    "F",
    # pycodestyle
    "E4",
    "E7",
    "E9",
    # isort
    "I",
    # pep8-naming
    "N",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    # Allow using star imports in __init__.py modules for giving easy access to
    # all exports defined in a package
    "F401", "F403", "F405",
]
