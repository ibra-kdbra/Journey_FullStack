[tool.poetry]
name = "rag-backend"
version = "0.1.0"
description = "Backend API for RAG application"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = ">=0.109.2,<0.142.0"
uvicorn = ">=0.27.1,<0.53.0"
pymilvus = ">=2.3.6,<4.0.0"
pydantic = "^2.6.1"
pydantic-settings = "^2.1.0"
langchain = "^1.0.2"
langchain-ollama = ">=0.3,<1.2" 
langchain-community = ">=0.3.20,<0.5.0"
python-multipart = ">=0.0.20,<0.0.33"
sentence-transformers = ">=2.5.1,<7.0.0"
# Pinned to the pairing that actually imports. PR #1416 moved langgraph
# 1.0.1 -> 1.0.10 and langgraph-prebuilt 1.0.1 -> 1.0.13, and prebuilt >=1.0.11
# does `from langgraph.runtime import ExecutionInfo`, which no langgraph in the
# 1.0.x line exports. prebuilt's metadata names only langchain-core and
# langgraph-checkpoint, so nothing stops the resolver pairing them: the install
# succeeds and `import app` raises ImportError. langchain caps langgraph at
# <1.1.0, so moving forward is not available either.
langgraph = ">=0.3.26,<1.0.2"
langgraph-prebuilt = "<1.0.2"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-asyncio = ">=0.23.5,<1.5.0"
pytest-cov = "^7.1.0"
httpx = "^0.28.1"
black = ">=24.1.1,<27.0.0"
mypy = ">=1.8,<3.0"
pylint = ">=3.0.3,<5.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
