[tool.poetry]
name = "rag-pipeline"
version = "0.1.0"
description = "Pipeline for processing markdown documents and uploading them to Milvus for RAG applications"
authors = ["ssgrummons <ssgrummo@us.ibm.com>"]
readme = "README.md"
packages = [{include = "pipeline.py"}]

[tool.poetry.dependencies]
python = "^3.9"
pymilvus = "^3.0.1"
sentence-transformers = "^5.1.2"
keybert = "^0.9.0"
python-frontmatter = "^1.2.0"
markdown = "^3.9.0"
langchain = "^0.3.30"
pyyaml = "^6.0.3"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"
pytest-cov = "^7.1.0"
pytest-mock = "^3.15.1"
black = "^25.11.0"
isort = "^6.1.0"
mypy = "^1.19.1"
pylint = "^3.3.9"
ruff = "^0.15.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py39']

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=pipeline --cov-report=term-missing" 

[tool.ruff]
# This project declares python = "^3.9", so the floor is stated rather than
# inferred: ruff's own default target has moved between releases, and a rewrite
# that assumes 3.10 would break the declared support range silently.
target-version = "py39"

[tool.ruff.lint]
# Wider than ruff's default (E4, E7, E9, F), which is what this project ran when
# lint was first enabled. The default earned its place then - it found eight real
# problems - but it cannot see the eleven broken exception chains B reports, so
# a green under the default alone said less than it appeared to.
#   I  - import sorting
#   UP - pyupgrade; every finding here is PEP 585 generics, redundant open()
#        modes and the deprecated typing aliases, all valid from 3.9
#   B  - bugbear
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
