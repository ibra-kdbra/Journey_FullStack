server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # Gateway 5.0 moved every property under server.webflux (or server.webmvc).
      # The old spring.cloud.gateway.* keys no longer exist, and nothing binds
      # them — the app would start clean and route nothing.
      server:
        webflux:
          # The discovery locator is deliberately off: it would route every
          # service registered in Eureka at /<service-name>/**. Only the routes
          # declared below are reachable through the gateway.
          routes:
            - id: patient-service
              uri: lb://patient-service
              predicates:
                - Path=/api/v1/patients/**

hospital:
  security:
    # Credentials clients must present to the gateway (HTTP Basic). Required.
    # The gateway forwards the Authorization header, so patient-service checks
    # the same credentials again.
    username: ${HOSPITAL_API_USER}
    password: ${HOSPITAL_API_PASSWORD}

eureka:
  client:
    serviceUrl:
      defaultZone: http://${EUREKA_USER}:${EUREKA_PASSWORD}@${EUREKA_HOST:localhost}:8761/eureka/
