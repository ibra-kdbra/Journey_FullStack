# Dependabot configuration for the Journey_FullStack monorepo.
#
# Design notes:
#   * Every `directory` below MUST exist and MUST contain a manifest for its
#     ecosystem. A stale directory makes the update job for that entry fail
#     forever (this is what `/task-manager` used to do).
#   * Updates are GROUPED. Before grouping this repo produced one PR per
#     dependency per project per week, which is where the ~1200 PR backlog came
#     from. Grouping collapses that into one PR per project per week for
#     minor/patch, and keeps majors separate so they get a real review.
#   * Python projects use `pip` — that is the ecosystem that understands
#     Poetry's pyproject.toml/poetry.lock. There is no `poetry` ecosystem.
#
# Keep this file in sync with .github/projects.json; ci.yml enforces it.
version: 2

updates:
  # ----------------------------------------------------------------- tooling
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  # ------------------------------------------------------------ frontend: js
  - package-ecosystem: "npm"
    directory: "/react-s.o.l.i.d"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
    commit-message: { prefix: "deps(react-solid)" }
    groups:
      react-solid-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      react-solid-major:
        patterns: ["*"]
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/vue.js-s.o.l.i.d"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
    commit-message: { prefix: "deps(vue-solid)" }
    groups:
      vue-solid-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      vue-solid-major:
        patterns: ["*"]
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/vue3-clean-architecture"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
    commit-message: { prefix: "deps(vue3-clean)" }
    # typescript majors are held: see docs/ENGINEERING.md#known-open-work and
    # issue #1296. Without this, Dependabot reopens the same red PR every week.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      vue3-clean-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      vue3-clean-major:
        patterns: ["*"]
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/nuxt-clean-architecture"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
    commit-message: { prefix: "deps(nuxt-clean)" }
    groups:
      nuxt-clean-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      nuxt-clean-major:
        patterns: ["*"]
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/angular-s.o.l.i.d-advanced"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
    commit-message: { prefix: "deps(angular-solid)" }
    # typescript majors are held: see docs/ENGINEERING.md#known-open-work and
    # issue #1296. Without this, Dependabot reopens the same red PR every week.
    #
    # jasmine majors are held. jasmine-core 6 made its env methods
    # non-writable, and zone.js 0.16.2 - the version Angular 22 pins - patches
    # them by assignment:
    #
    #   TypeError: Cannot assign to read only property 'describe'
    #     at zone.js/fesm2015/zone-testing.js:86
    #
    # The whole suite dies at load, so this is not a stylistic hold. It lifts
    # when zone.js stops assigning. See issue #1407.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jasmine-core"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/jasmine"
        update-types: ["version-update:semver-major"]
    groups:
      angular-platform:
        patterns: ["@angular/*", "@angular-devkit/*", "zone.js", "rxjs"]
      angular-solid-minor:
        patterns: ["*"]
        exclude-patterns: ["@angular/*", "@angular-devkit/*"]
        update-types: ["minor", "patch"]
      angular-solid-major:
        patterns: ["*"]
        exclude-patterns: ["@angular/*", "@angular-devkit/*"]
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/astro-starter"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
    commit-message: { prefix: "deps(astro)" }
    groups:
      astro-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      astro-major:
        patterns: ["*"]
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/sveltekit"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
    commit-message: { prefix: "deps(sveltekit)" }
    # typescript 7 is held, but 6 is not: both of this project's TS-consuming
    # tools accept 6 and refuse 7 by name. Verified by forcing 7.0.2 in:
    #
    #   svelte-check       "TypeScript 7 support currently requires both
    #                       TypeScript 7 and TypeScript 6 installed in your
    #                       project, and requires using the --tsgo ... flag"
    #   typescript-eslint  "typescript-eslint does not support TS 7.0."
    #
    # npm refuses it before that anyway - svelte-check 4.7.6 peers
    # `^5.0.0 || ^6.0.0` and typescript-eslint 8.68.0 peers `>=4.8.4 <6.1.0`.
    # This is a `versions` bound rather than the semver-major form used for
    # the four holds in #1296, because a TS 6 bump here would genuinely work
    # and should not be blocked. See #1296 and issue #1360.
    #
    # mjml 5 is held: sailkit is the only consumer and its latest release,
    # 0.3.5, peers `mjml: "^4.0.0"`. The project imports mjml nowhere itself,
    # so this is purely sailkit's constraint to widen. See issue #1360.
    ignore:
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
      - dependency-name: "mjml"
        update-types: ["version-update:semver-major"]
    groups:
      sveltekit-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      sveltekit-major:
        patterns: ["*"]
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/next-prisma-starter"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
    commit-message: { prefix: "deps(next-prisma)" }
    groups:
      next-platform:
        patterns: ["next", "eslint-config-next", "@next/*", "react", "react-dom"]
      next-prisma-minor:
        patterns: ["*"]
        exclude-patterns: ["next", "eslint-config-next", "@next/*"]
        update-types: ["minor", "patch"]
      next-prisma-major:
        patterns: ["*"]
        exclude-patterns: ["next", "eslint-config-next", "@next/*"]
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/rn_clean_architecture"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
    commit-message: { prefix: "deps(rn-clean)" }
    # Babel 8 and jest 30 majors are held: React Native 0.87's presets reject
    # both at runtime while declaring peers loose enough for npm to install
    # them, so the PRs resolve cleanly and then fail. Verified against 0.87.0,
    # each isolated from the other:
    #
    #   @babel/core 8.0.1  -> [BABEL] @react-native/jest-preset requires Babel
    #                         "^7.0.0-0", but was loaded with "8.0.1", thrown
    #                         from @react-native/babel-preset's overrides
    #   jest 30.4.2        -> TypeError: this._moduleMocker.clearMocksOnScope
    #                         is not a function, in jest-runtime
    #
    # @react-native/babel-preset declares `@babel/core: "*"`, which is why the
    # peer graph never objects. Lift these when React Native ships presets that
    # accept Babel 8 and jest 30. See issue #1360 and docs/DEPENDENCIES.md.
    ignore:
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jest-environment-node"
        update-types: ["version-update:semver-major"]
    groups:
      react-native-platform:
        patterns: ["react-native", "@react-native/*", "@react-native-community/*"]
      rn-clean-minor:
        patterns: ["*"]
        exclude-patterns: ["react-native", "@react-native/*"]
        update-types: ["minor", "patch"]
      rn-clean-major:
        patterns: ["*"]
        exclude-patterns: ["react-native", "@react-native/*"]
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/solid-flask-web-app/ui"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
    commit-message: { prefix: "deps(flask-ui)" }
    groups:
      flask-ui-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      flask-ui-major:
        patterns: ["*"]
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/learning-doc"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
    commit-message: { prefix: "deps(atlas)" }
    groups:
      nuxt-platform:
        patterns: ["nuxt", "@nuxt/*", "@nuxtjs/*", "nitropack", "vue"]
      atlas-minor:
        patterns: ["*"]
        exclude-patterns: ["nuxt", "@nuxt/*", "@nuxtjs/*"]
        update-types: ["minor", "patch"]
      atlas-major:
        patterns: ["*"]
        exclude-patterns: ["nuxt", "@nuxt/*", "@nuxtjs/*"]
        update-types: ["version-update:semver-major"]

  # ------------------------------------------------------------- backend: js
  - package-ecosystem: "npm"
    directory: "/nodejs-s.o.l.i.d"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
    commit-message: { prefix: "deps(node-solid)" }
    groups:
      node-solid-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      node-solid-major:
        patterns: ["*"]
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/nestjs-s.o.l.i.d"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
    commit-message: { prefix: "deps(nest-solid)" }
    # typescript majors are held: see docs/ENGINEERING.md#known-open-work and
    # issue #1296. Without this, Dependabot reopens the same red PR every week.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      nest-platform:
        patterns: ["@nestjs/*"]
      nest-solid-minor:
        patterns: ["*"]
        exclude-patterns: ["@nestjs/*"]
        update-types: ["minor", "patch"]
      nest-solid-major:
        patterns: ["*"]
        exclude-patterns: ["@nestjs/*"]
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/API_s.o.l.i.d_TS"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
    commit-message: { prefix: "deps(api-solid)" }
    # typescript majors are held: see docs/ENGINEERING.md#known-open-work and
    # issue #1296. ts-node cannot load under TS 7 - the programmatic compiler
    # API it needs was removed - so the dev server and jest both die on import.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      api-solid-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      api-solid-major:
        patterns: ["*"]
        update-types: ["version-update:semver-major"]

  # Bun, not npm: the npm ecosystem updates package.json but never writes
  # bun.lock, so `bun install --frozen-lockfile` in CI rejected every update.
  - package-ecosystem: "bun"
    directory: "/Hono-Postgres"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
    commit-message: { prefix: "deps(hono)" }
    groups:
      hono-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      hono-major:
        patterns: ["*"]
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/vercel-cleaner"
    schedule: { interval: "monthly" }
    open-pull-requests-limit: 2
    commit-message: { prefix: "deps(vercel-cleaner)" }
    groups:
      vercel-cleaner-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      vercel-cleaner-major:
        patterns: ["*"]
        update-types: ["version-update:semver-major"]

  # --------------------------------------------------------------- python
  # `pip` is the ecosystem that reads Poetry's pyproject.toml + poetry.lock.
  - package-ecosystem: "pip"
    directory: "/solid-flask-web-app/api"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
    commit-message: { prefix: "deps(flask-api)" }
    groups:
      flask-api-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      flask-api-major:
        patterns: ["*"]
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "pip"
    directory: "/RAG-streamlit/backend"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
    commit-message: { prefix: "deps(rag-backend)" }
    groups:
      rag-backend-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      rag-backend-major:
        patterns: ["*"]
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "pip"
    directory: "/RAG-streamlit/frontend"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
    commit-message: { prefix: "deps(rag-frontend)" }
    groups:
      rag-frontend-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      rag-frontend-major:
        patterns: ["*"]
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "pip"
    directory: "/RAG-streamlit/pipelines"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
    commit-message: { prefix: "deps(rag-pipelines)" }
    groups:
      rag-pipelines-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      rag-pipelines-major:
        patterns: ["*"]
        update-types: ["version-update:semver-major"]

  # ------------------------------------------------------------------ java
  # hospital-management has no aggregator POM, so each service is its own entry.
  # billing-service / clinical-service / scheduling-service ship sources but no
  # pom.xml yet — add entries here once their POMs land.
  - package-ecosystem: "maven"
    directory: "/hospital-management/billing-service"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
    commit-message: { prefix: "deps(billing-service)" }
    groups:
      billing-service-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "maven"
    directory: "/hospital-management/clinical-service"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
    commit-message: { prefix: "deps(clinical-service)" }
    groups:
      clinical-service-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "maven"
    directory: "/hospital-management/scheduling-service"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
    commit-message: { prefix: "deps(scheduling-service)" }
    groups:
      scheduling-service-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "maven"
    directory: "/hospital-management/discovery-server"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 3
    commit-message: { prefix: "deps(discovery-server)" }
    groups:
      spring:
        patterns: ["org.springframework*:*", "org.springframework.cloud:*"]
      discovery-server-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "maven"
    directory: "/hospital-management/api-gateway"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 3
    commit-message: { prefix: "deps(api-gateway)" }
    groups:
      spring:
        patterns: ["org.springframework*:*", "org.springframework.cloud:*"]
      api-gateway-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "maven"
    directory: "/hospital-management/patient-service"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 3
    commit-message: { prefix: "deps(patient-service)" }
    groups:
      spring:
        patterns: ["org.springframework*:*", "org.springframework.cloud:*"]
      patient-service-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ---------------------------------------------------------------- docker
  - package-ecosystem: "docker"
    directories:
      - "/solid-flask-web-app/ui"
      - "/RAG-streamlit/backend"
      - "/RAG-streamlit/frontend"
    schedule: { interval: "monthly" }
    open-pull-requests-limit: 3
    commit-message: { prefix: "deps(docker)" }
    groups:
      base-images:
        patterns: ["*"]
