name: CI

# Per-project verification for a repository of seventeen independent toolchains.
#
# Nothing here is hardcoded: .github/projects.json declares which projects exist,
# what toolchain each needs, and which checks are known to pass. A check is only
# ever enabled in the manifest after it has been observed passing — that is what
# keeps this workflow green and therefore meaningful.
#
# See docs/ENGINEERING.md#how-ci-works.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_all:
        description: 'Check every enabled project, ignoring the diff'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Detect affected projects
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      count: ${{ steps.detect.outputs.count }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Detect
        id: detect
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            changed=$(git diff --name-only "$base" "$head")
          elif [ "${{ inputs.run_all }}" = "true" ]; then
            # Force every enabled project by pretending CI config changed.
            changed=".github/projects.json"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            changed=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
          else
            changed=$(git diff --name-only "${{ github.sha }}~1" "${{ github.sha }}" || echo ".github/projects.json")
          fi

          matrix=$(printf '%s\n' "$changed" | node .github/scripts/changed-projects.mjs)
          count=$(node -e "process.stdout.write(String(JSON.parse(process.argv[1]).length))" "$matrix")

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"

          {
            echo "### Affected projects: $count"
            echo ''
            node -e "
              const m = JSON.parse(process.argv[1]);
              if (!m.length) { console.log('_No project files changed — nothing to build._'); process.exit(0); }
              console.log('| Project | Runtime | install | build | lint | typecheck | test |');
              console.log('|:--|:--|:--|:--|:--|:--|:--|');
              const tick = (v) => v ? 'yes' : '—';
              for (const p of m) {
                console.log(\`| \\\`\${p.path}\\\` | \${p.runtime} | \${tick(p.install)} | \${tick(p.build)} | \${tick(p.lint)} | \${p.typecheck || '—'} | \${tick(p.test)} |\`);
              }
            " "$matrix"
          } >> "$GITHUB_STEP_SUMMARY"

  project:
    name: ${{ matrix.project.name }}
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.discover.outputs.matrix) }}
    defaults:
      run:
        working-directory: ${{ matrix.project.path }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        if: matrix.project.ecosystem == 'node' && matrix.project.packageManager != 'bun'
        with:
          node-version: ${{ matrix.project.node }}

      - uses: oven-sh/setup-bun@v2
        if: matrix.project.packageManager == 'bun'

      # package_json_file is required: the action reads `packageManager` from the
      # repository root by default, and this monorepo has no root package.json.
      # Without it the step fails with "Please specify it by one of the
      # following ways".
      - uses: pnpm/action-setup@v6
        if: matrix.project.packageManager == 'pnpm'
        with:
          package_json_file: ${{ matrix.project.path }}/package.json

      - uses: actions/setup-python@v7
        if: matrix.project.ecosystem == 'python'
        with:
          python-version: ${{ matrix.project.python }}

      - uses: actions/setup-java@v6
        if: matrix.project.ecosystem == 'maven'
        with:
          distribution: temurin
          java-version: ${{ matrix.project.java }}
          cache: maven

      - name: Install Poetry
        if: matrix.project.ecosystem == 'python' && matrix.project.packageManager == 'poetry'
        run: pipx install poetry
        working-directory: .

      # Declared per project in the manifest rather than hardcoded here — the
      # Flask API needs MySQL client headers to build mysqlclient from source.
      - name: Install system packages
        if: join(matrix.project.systemPackages, ' ') != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ${{ join(matrix.project.systemPackages, ' ') }}
        working-directory: .

      # GitHub's ubuntu images ship PostgreSQL installed but stopped. Starting it
      # here rather than declaring a `services:` container keeps the cost on the
      # one project that needs a database, instead of adding a container start to
      # all twenty-one jobs.
      #
      # DATABASE_URL is composed here rather than written in the manifest. A
      # postgresql://user:pass@host string in a project's `env` block ends up
      # inside the matrix JSON, and the runner refuses to publish a job output
      # that looks like it carries a credential: "Skip output 'matrix' since it
      # may contain secret". The matrix then arrives empty, fromJSON() gets
      # nothing, and every project job silently fails to exist. The manifest
      # names the database; the connection string is built next to the server
      # that the same step just created it on.
      - name: Start PostgreSQL
        if: matrix.project.postgres
        run: |
          sudo systemctl start postgresql.service
          for i in $(seq 1 30); do pg_isready -h localhost -p 5432 && break; sleep 1; done
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres createdb "$DB_NAME"
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/$DB_NAME" >> "$GITHUB_ENV"
        env:
          DB_NAME: ${{ matrix.project.postgres }}
        working-directory: .

      # The JSON arrives through the env block, not interpolated into the script.
      # Interpolating it put GitHub's `toJSON` output inside a double-quoted
      # shell string, which strips the quotes: a value like
      # http://localhost:5173 then reached node as bare syntax and threw
      # `SyntaxError: Unexpected token ':'`. It only ever worked because the
      # sole env value in the manifest was the number 0, which happens to
      # survive quote-stripping as valid JavaScript.
      - name: Apply project environment
        if: toJSON(matrix.project.env) != '{}'
        env:
          PROJECT_ENV: ${{ toJSON(matrix.project.env) }}
        run: |
          node -e '
            const env = JSON.parse(process.env.PROJECT_ENV);
            const fs = require("fs");
            for (const [k, v] of Object.entries(env)) {
              fs.appendFileSync(process.env.GITHUB_ENV, `${k}=${v}\n`);
            }
          '
        working-directory: .

      - name: Install
        if: matrix.project.install
        run: |
          if [ "${{ matrix.project.ecosystem }}" = "python" ]; then
            if [ "${{ matrix.project.packageManager }}" = "pip" ]; then
              python -m pip install --upgrade pip
              pip install -r requirements.txt
              [ -f requirements_dev.txt ] && pip install -r requirements_dev.txt
            else
              # `check --lock` fails when pyproject.toml has moved on without
              # poetry.lock — the drift a manifest-only dependency bump creates,
              # and the same class of break that hid in Hono-Postgres.
              poetry check --lock
              poetry install
            fi
          elif [ "${{ matrix.project.packageManager }}" = "bun" ]; then
            bun install --frozen-lockfile
          elif [ "${{ matrix.project.packageManager }}" = "pnpm" ]; then
            # --frozen-lockfile verifies the committed lockfile as well as
            # installing from it. That is the whole point of honouring the
            # project's `packageManager` declaration rather than reaching for
            # npm: a lockfile nothing reads is a lockfile nothing checks.
            pnpm install --frozen-lockfile
          elif [ -f package-lock.json ]; then
            # ADR 0005. The lockfile's presence is the signal, not a manifest
            # flag: the filesystem cannot disagree with itself. `npm ci` fails
            # when the lockfile and package.json diverge, which is the property
            # a committed-but-unread lockfile never had.
            #
            # installFlags is per project and empty by default. Anything in it
            # is a peer conflict someone wrote down — see issue #1289 — not a
            # blanket escape hatch applied to every project at once.
            echo "::notice::npm ci (lockfile present) ${{ join(matrix.project.installFlags, ' ') }}"
            npm ci --no-audit --no-fund ${{ join(matrix.project.installFlags, ' ') }}
          else
            # Not yet migrated under ADR 0005. Resolves fresh every run, so a
            # green result says nothing about the next one.
            echo "::notice::npm install (no lockfile — see ADR 0005)"
            npm install --no-audit --no-fund --legacy-peer-deps
          fi

      - name: Lint
        if: matrix.project.lint
        run: |
          if [ "${{ matrix.project.ecosystem }}" = "python" ]; then
            # Only the pip-managed Flask API sets lint: true, and ruff is on PATH
            # from its requirements_dev.txt. The Poetry projects carry
            # black/pylint/mypy but none has been observed clean, so none enables
            # lint; the PR that turns one on adds the `poetry run` form it verified.
            ruff check .
          elif [ "${{ matrix.project.packageManager }}" = "pnpm" ]; then
            pnpm run lint
          elif [ "${{ matrix.project.packageManager }}" = "bun" ]; then
            bun run lint
          else
            npm run lint
          fi

      # A string, not a boolean: the three projects with a type-check script call
      # it `check`, `typecheck` and `type-check`. Naming it in the manifest beats
      # guessing here, and '' means the project has none.
      - name: Typecheck
        if: matrix.project.typecheck != ''
        run: |
          if [ "${{ matrix.project.packageManager }}" = "pnpm" ]; then
            pnpm run ${{ matrix.project.typecheck }}
          elif [ "${{ matrix.project.packageManager }}" = "bun" ]; then
            bun run ${{ matrix.project.typecheck }}
          else
            npm run ${{ matrix.project.typecheck }}
          fi

      - name: Build
        if: matrix.project.build
        run: |
          if [ "${{ matrix.project.ecosystem }}" = "maven" ]; then
            mvn -B -DskipTests package
          elif [ "${{ matrix.project.packageManager }}" = "pnpm" ]; then
            pnpm run build
          elif [ "${{ matrix.project.packageManager }}" = "bun" ]; then
            bun run build
          else
            npm run build
          fi

      - name: Test
        if: matrix.project.test
        run: |
          if [ "${{ matrix.project.ecosystem }}" = "maven" ]; then
            mvn -B verify
          elif [ "${{ matrix.project.ecosystem }}" = "python" ]; then
            if [ "${{ matrix.project.packageManager }}" = "pip" ]; then
              pytest
            else
              poetry run pytest
            fi
          elif [ "${{ matrix.project.packageManager }}" = "pnpm" ]; then
            pnpm test
          elif [ "${{ matrix.project.packageManager }}" = "bun" ]; then
            bun test
          else
            npm test
          fi

  result:
    name: CI result
    needs: [discover, project]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report
        env:
          # Not interpolated into the script: this is the matrix JSON, and the
          # only thing done with it is an emptiness test.
          MATRIX: ${{ needs.discover.outputs.matrix }}
        run: |
          if [ "${{ needs.discover.result }}" != "success" ]; then
            echo "Project detection failed."
            exit 1
          fi
          if [ "${{ needs.discover.outputs.count }}" = "0" ]; then
            echo "No project files changed — nothing to verify."
            exit 0
          fi
          # Detection claimed work but the matrix never arrived. The runner
          # drops a job output it suspects of carrying a credential, and the
          # matrix job then expands to nothing: no project job runs, and the
          # next check below reports a failure that never happened. Say what
          # actually went wrong instead.
          if [ -z "$MATRIX" ]; then
            echo "Detection selected ${{ needs.discover.outputs.count }} projects but the matrix output is empty."
            echo "The runner skipped it - check the Detect job log for \"Skip output 'matrix' since it may contain secret\"."
            echo "Something in .github/projects.json looks like a credential; see the Start PostgreSQL step comment."
            exit 1
          fi
          if [ "${{ needs.project.result }}" != "success" ]; then
            echo "At least one project check failed."
            exit 1
          fi
          echo "All affected projects passed."
