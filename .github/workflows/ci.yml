name: CI

# Per-project verification for a repository of seventeen independent toolchains.
#
# Nothing here is hardcoded: .github/projects.json declares which projects exist,
# what toolchain each needs, and which checks are known to pass. A check is only
# ever enabled in the manifest after it has been observed passing — that is what
# keeps this workflow green and therefore meaningful.
#
# See docs/ENGINEERING.md#how-ci-works.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_all:
        description: 'Check every enabled project, ignoring the diff'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Detect affected projects
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      count: ${{ steps.detect.outputs.count }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Detect
        id: detect
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            changed=$(git diff --name-only "$base" "$head")
          elif [ "${{ inputs.run_all }}" = "true" ]; then
            # Force every enabled project by pretending CI config changed.
            changed=".github/projects.json"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            changed=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
          else
            changed=$(git diff --name-only "${{ github.sha }}~1" "${{ github.sha }}" || echo ".github/projects.json")
          fi

          matrix=$(printf '%s\n' "$changed" | node .github/scripts/changed-projects.mjs)
          count=$(node -e "process.stdout.write(String(JSON.parse(process.argv[1]).length))" "$matrix")

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"

          {
            echo "### Affected projects: $count"
            echo ''
            node -e "
              const m = JSON.parse(process.argv[1]);
              if (!m.length) { console.log('_No project files changed — nothing to build._'); process.exit(0); }
              console.log('| Project | Runtime | install | build | lint | test |');
              console.log('|:--|:--|:--|:--|:--|:--|');
              const tick = (v) => v ? 'yes' : '—';
              for (const p of m) {
                console.log(\`| \\\`\${p.path}\\\` | \${p.runtime} | \${tick(p.install)} | \${tick(p.build)} | \${tick(p.lint)} | \${tick(p.test)} |\`);
              }
            " "$matrix"
          } >> "$GITHUB_STEP_SUMMARY"

  project:
    name: ${{ matrix.project.name }}
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.discover.outputs.matrix) }}
    defaults:
      run:
        working-directory: ${{ matrix.project.path }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        if: matrix.project.ecosystem == 'node' && matrix.project.packageManager != 'bun'
        with:
          node-version: ${{ matrix.project.node }}

      - uses: oven-sh/setup-bun@v2
        if: matrix.project.packageManager == 'bun'

      - uses: actions/setup-python@v7
        if: matrix.project.ecosystem == 'python'
        with:
          python-version: ${{ matrix.project.python }}

      - uses: actions/setup-java@v5
        if: matrix.project.ecosystem == 'maven'
        with:
          distribution: temurin
          java-version: ${{ matrix.project.java }}
          cache: maven

      - name: Install Poetry
        if: matrix.project.ecosystem == 'python' && matrix.project.packageManager == 'poetry'
        run: pipx install poetry
        working-directory: .

      # Declared per project in the manifest rather than hardcoded here — the
      # Flask API needs MySQL client headers to build mysqlclient from source.
      - name: Install system packages
        if: join(matrix.project.systemPackages, ' ') != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ${{ join(matrix.project.systemPackages, ' ') }}
        working-directory: .

      - name: Apply project environment
        if: toJSON(matrix.project.env) != '{}'
        run: |
          node -e "
            const env = ${{ toJSON(matrix.project.env) }};
            const fs = require('fs');
            for (const [k, v] of Object.entries(env)) fs.appendFileSync(process.env.GITHUB_ENV, k + '=' + v + '\n');
          "
        working-directory: .

      - name: Install
        if: matrix.project.install
        run: |
          if [ "${{ matrix.project.ecosystem }}" = "python" ]; then
            if [ "${{ matrix.project.packageManager }}" = "pip" ]; then
              python -m pip install --upgrade pip
              pip install -r requirements.txt
              [ -f requirements_dev.txt ] && pip install -r requirements_dev.txt
            else
              # `check --lock` fails when pyproject.toml has moved on without
              # poetry.lock — the drift a manifest-only dependency bump creates,
              # and the same class of break that hid in Hono-Postgres.
              poetry check --lock
              poetry install
            fi
          elif [ "${{ matrix.project.packageManager }}" = "bun" ]; then
            bun install --frozen-lockfile
          else
            # No lockfiles are committed yet, so `npm ci` is not available.
            # See docs/ENGINEERING.md#known-open-work.
            npm install --no-audit --no-fund --legacy-peer-deps
          fi

      - name: Lint
        if: matrix.project.lint
        run: |
          if [ "${{ matrix.project.ecosystem }}" = "python" ]; then
            # Only the pip-managed Flask API sets lint: true, and ruff is on PATH
            # from its requirements_dev.txt. The Poetry projects carry
            # black/pylint/mypy but none has been observed clean, so none enables
            # lint; the PR that turns one on adds the `poetry run` form it verified.
            ruff check .
          else
            npm run lint
          fi

      - name: Build
        if: matrix.project.build
        run: |
          if [ "${{ matrix.project.ecosystem }}" = "maven" ]; then
            mvn -B -DskipTests package
          else
            npm run build
          fi

      - name: Test
        if: matrix.project.test
        run: |
          if [ "${{ matrix.project.ecosystem }}" = "maven" ]; then
            mvn -B verify
          elif [ "${{ matrix.project.ecosystem }}" = "python" ]; then
            if [ "${{ matrix.project.packageManager }}" = "pip" ]; then
              pytest
            else
              poetry run pytest
            fi
          else
            npm test
          fi

  result:
    name: CI result
    needs: [discover, project]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report
        run: |
          if [ "${{ needs.discover.result }}" != "success" ]; then
            echo "Project detection failed."
            exit 1
          fi
          if [ "${{ needs.discover.outputs.count }}" = "0" ]; then
            echo "No project files changed — nothing to verify."
            exit 0
          fi
          if [ "${{ needs.project.result }}" != "success" ]; then
            echo "At least one project check failed."
            exit 1
          fi
          echo "All affected projects passed."
