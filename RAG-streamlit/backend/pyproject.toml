[tool.poetry]
name = "rag-backend"
version = "0.1.0"
description = "Backend API for RAG application"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = ">=0.109.2,<0.142.0"
uvicorn = ">=0.27.1,<0.53.0"
pymilvus = ">=2.3.6,<4.0.0"
pydantic = "^2.6.1"
pydantic-settings = "^2.1.0"
langchain = "^1.4.0"
langchain-ollama = ">=0.3,<1.2" 
langchain-community = ">=0.3.20,<0.5.0"
python-multipart = ">=0.0.20,<0.0.33"
sentence-transformers = ">=2.5.1,<7.0.0"
# langgraph-prebuilt is deliberately absent. It used to be pinned <1.0.2,
# because prebuilt >=1.0.11 does `from langgraph.runtime import ExecutionInfo`
# while no langgraph in the 1.0.x line exported it, and prebuilt's metadata
# named only langchain-core and langgraph-checkpoint - so nothing stopped the
# resolver pairing them, the install succeeded and `import app` raised
# ImportError (issue #1423). langgraph now declares the range itself
# (1.2.11 requires langgraph-prebuilt >=1.1.0,<1.2.0), so the pairing is the
# resolver's to get right rather than ours to police. Pinning it again would
# re-freeze a constraint upstream has since taken over.
langgraph = ">=1.2.11,<1.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-asyncio = ">=0.23.5,<1.5.0"
pytest-cov = "^7.1.0"
httpx = "^0.28.1"
black = ">=24.1.1,<27.0.0"
mypy = ">=1.8,<3.0"
pylint = ">=3.0.3,<5.0.0"
ruff = "^0.16.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3

[tool.ruff]
# The notebook is interactive scratch: imports live mid-cell and are pulled in
# to poke at, so E402 and F401 fire twelve times there and mean nothing. src/
# and tests/ are the code that ships.
extend-exclude = ["test_notebook.ipynb"]

[tool.ruff.lint]
# Ruff's default (E4, E7, E9, F) finds nothing here - src/ and tests/ were
# already clean under it, so gating on the default alone would have been a
# green that could never have been red. These three earn the check its place:
#   I  - import sorting
#   UP - pyupgrade; safe outright, since this project requires Python ^3.12
#   B  - bugbear, which is what found the three broken exception chains
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
